<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学生会 · 评分系统</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            background: #f4f7fc;
            padding: 12px;
            font-size: 14px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 18px;
            color: #1a3a5c;
        }
        .header h1 small {
            font-size: 12px;
            font-weight: normal;
            color: #666;
            margin-left: 6px;
            display: block;
        }
        .user-badge {
            background: #1a4b7a;
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1a4b7a !important;
            color: #fff !important;
            border: none !important;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-primary:disabled {
            background: #ccc !important;
            color: #888 !important;
            cursor: not-allowed;
        }

        .table-wrap {
            overflow-x: auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            padding: 6px 0;
            margin-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 500px;
        }
        th {
            background: #f0f4fa;
            padding: 8px 4px;
            text-align: center;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e2e8f0;
            font-size: 12px;
        }
        td {
            padding: 6px 3px;
            text-align: center;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }
        .dept-tag {
            background: #e9edf2;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: #444;
            display: inline-block;
            white-space: nowrap;
        }
        input[type="number"] {
            width: 58px;
            padding: 6px 0;
            text-align: center;
            border: 2px solid #1a4b7a;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            background: #ffffff;
            color: #1a3a5c;
        }
        input[type="number"]:focus {
            border-color: #0f3a5f;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 75, 122, 0.15);
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .peer-btn-group {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .peer-btn {
            padding: 3px 10px;
            border: 2px solid #d1d9e6;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: #333;
            transition: 0.15s;
            min-width: 44px;
        }
        .peer-btn:hover {
            border-color: #1a4b7a;
        }
        .peer-btn.selected-40 {
            border-color: #ef4444;
            background: #fecaca;
            color: #991b1b;
        }
        .peer-btn.selected-60 {
            border-color: #eab308;
            background: #fef9c3;
            color: #854d0e;
        }
        .peer-btn.selected-80 {
            border-color: #22c55e;
            background: #dcfce7;
            color: #166534;
        }

        .grade-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .grade-good {
            background: #dbeafe;
            color: #1e40af;
        }
        .grade-pass {
            background: #fef9c3;
            color: #854d0e;
        }
        .grade-fail {
            background: #fecaca;
            color: #991b1b;
        }

        .chair-stats {
            background: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            font-size: 13px;
        }
        .chair-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            flex-wrap: wrap;
        }
        .chair-item .label {
            font-weight: 700;
            color: #1a4b7a;
            font-size: 14px;
        }
        .chair-item .value {
            font-weight: 700;
            color: #0f172a;
            font-size: 16px;
        }
        .stat-pass {
            color: #16a34a;
            font-weight: 600;
        }
        .stat-fail {
            color: #dc2626;
            font-weight: 600;
        }

        .grade-legend {
            background: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            margin: 10px 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: none;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            border-left: 4px solid #1a4b7a;
            font-size: 13px;
        }
        .grade-legend.show {
            display: flex;
        }
        .grade-legend .title {
            font-weight: 700;
            color: #1a3a5c;
            font-size: 14px;
        }
        .grade-legend .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .grade-legend .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        .dot-blue {
            background: #3b82f6;
        }
        .dot-yellow {
            background: #eab308;
        }
        .dot-red {
            background: #ef4444;
        }

        .footer-tip {
            color: #888;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background: #fff;
            padding: 30px 28px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal-box h2 {
            font-size: 20px;
            color: #1a3a5c;
            margin-bottom: 6px;
        }
        .modal-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .modal-box input {
            width: 100%;
            padding: 10px 14px;
            font-size: 16px;
            border: 2px solid #d1d9e6;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 14px;
        }
        .modal-box input:focus {
            border-color: #1a4b7a;
            outline: none;
        }
        .modal-box .error-msg {
            color: #dc2626;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 8px;
        }
        .modal-box button {
            width: 100%;
            padding: 10px;
            background: #1a4b7a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-box button:hover {
            background: #0f3a5f;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .dept-title {
            font-weight: 700;
            color: #1a3a5c;
            font-size: 14px;
            padding: 8px 12px;
            background: #f0f4fa;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .peer-status {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .header h1 {
                font-size: 16px;
            }
            .header h1 small {
                font-size: 11px;
            }
            input[type="number"] {
                width: 48px;
                font-size: 13px;
                padding: 4px 0;
            }
            th,
            td {
                padding: 4px 2px;
                font-size: 12px;
            }
            .dept-tag {
                font-size: 10px;
                padding: 1px 6px;
            }
            .grade-tag {
                font-size: 10px;
                padding: 1px 8px;
            }
            .chair-stats {
                font-size: 12px;
                padding: 8px 10px;
                gap: 6px 10px;
            }
            .chair-item .value {
                font-size: 14px;
            }
            .modal-box {
                padding: 24px 18px;
            }
            .peer-btn {
                font-size: 10px;
                padding: 2px 6px;
                min-width: 34px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 认证弹窗 ==================== -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h2>🔐 身份认证</h2>
            <p>请输入您的姓名进行身份验证</p>
            <input type="text" id="authInput" placeholder="请输入姓名..." onkeydown="if(event.key==='Enter') doAuth()">
            <div class="error-msg" id="authError"></div>
            <button onclick="doAuth()">确认身份</button>
        </div>
    </div>

    <!-- ==================== 主界面 ==================== -->
    <div class="container" id="mainApp" style="display:none;">
        <div class="header">
            <div>
                <h1 id="pageTitle">📋 主席评分 <small>19位部门负责人</small></h1>
            </div>
            <div class="header-actions">
                <span class="user-badge" id="userBadge">👤 用户</span>
                <button class="btn-primary" id="exportBtn" onclick="exportExcel()" disabled>⬇ 导出</button>
            </div>
        </div>

        <!-- ===== 主席专用 ===== -->
        <div id="chairSection">
            <div class="chair-stats" id="chairStats">
                <div class="chair-item"><span class="label" id="myLabel">👤 主席</span></div>
                <div class="chair-item"><span>平均</span><span class="value" id="myAvg">--</span></div>
                <div class="chair-item"><span>标准差</span><span class="value" id="myStd">--</span></div>
                <div class="chair-item"><span>极差</span><span class="value" id="myRange">--</span></div>
                <div class="chair-item" id="myStatus"></div>
            </div>

            <div class="grade-legend" id="gradeLegend">
                <span class="title">📊 等级</span>
                <span class="item"><span class="dot dot-blue"></span> 80+ 良好</span>
                <span class="item"><span class="dot dot-yellow"></span> 60-80 合格</span>
                <span class="item"><span class="dot dot-red"></span> 60- 不合格</span>
                <span style="color:#888;font-size:12px;">达标：标准差≥10 且 极差≥20</span>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="min-width:60px;">部门</th>
                            <th style="min-width:70px;">姓名</th>
                            <th style="min-width:70px;background:#dbeafe;color:#1a4b7a;">⭐ 评分</th>
                            <th style="min-width:56px;">等级</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ===== 负责人专用：互评 ===== -->
        <div id="peerSection" style="display:none;">
            <div style="background:#f0f4fa;border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:#333;">
                <strong>🤝 部门互评</strong><br>
                请给同部门的其他负责人打分：<span style="color:#991b1b;font-weight:600;">40分（不合格）</span> ·
                <span style="color:#854d0e;font-weight:600;">60分（合格）</span> ·
                <span style="color:#166534;font-weight:600;">80分（良好）</span>
            </div>
            <div id="peerContent"></div>
        </div>

        <div class="footer-tip" id="footerTip">💡 主席：输入分数 0-100 · 达标方可导出</div>
    </div>

    <script>
        // ==================== 所有用户 ====================
        var CHAIRS = ['陈润材', '蔡怡硕', '倪昊'];

        var MINISTERS = [
            { dept: '学术实践部', name: '古冠群' },
            { dept: '学术实践部', name: '郑雅文' },
            { dept: '学术实践部', name: '郭濠源' },
            { dept: '宣传部', name: '李炳锋' },
            { dept: '宣传部', name: '葛菲' },
            { dept: '宣传部', name: '肖健' },
            { dept: '文体部', name: '戴德音' },
            { dept: '文体部', name: '颜鼎堃' },
            { dept: '文体部', name: '杜思韬' },
            { dept: '文体部', name: '崔一茗' },
            { dept: '外联部', name: '陈泽宇' },
            { dept: '外联部', name: '陈思妍' },
            { dept: '外联部', name: '胡钦源' },
            { dept: '内联部', name: '唐开益' },
            { dept: '内联部', name: '王宇扬' },
            { dept: '内联部', name: '郑树天' },
            { dept: '办公室', name: '宋丰源' },
            { dept: '办公室', name: '姚远' },
            { dept: '办公室', name: '齐子赫' }
        ];

        var ALL_USERS = CHAIRS.concat(MINISTERS.map(function(m) { return m.name; }));

        var DEPT_GROUPS = {};
        MINISTERS.forEach(function(m, idx) {
            if (!DEPT_GROUPS[m.dept]) DEPT_GROUPS[m.dept] = [];
            DEPT_GROUPS[m.dept].push({ index: idx, name: m.name });
        });

        var PASS_STD = 10;
        var PASS_RANGE = 20;
        var currentUser = null;
        var currentUserIndex = -1;
        var isChair = false;

        // ==================== 互评数据 ====================
        var peerScores = {};
        for (var i = 0; i < MINISTERS.length; i++) {
            peerScores[i] = {};
            for (var j = 0; j < MINISTERS.length; j++) {
                peerScores[i][j] = null;
            }
        }

        // ==================== 工具函数 ====================
        function getGrade(score) {
            if (score >= 80) return { label: '良好', cls: 'grade-good' };
            if (score >= 60) return { label: '合格', cls: 'grade-pass' };
            return { label: '不合格', cls: 'grade-fail' };
        }

        // 计算某人的互评均分（同部门其他人给他打的平均分）
        function getPeerAverage(targetIndex) {
            var sum = 0,
                count = 0;
            for (var i = 0; i < MINISTERS.length; i++) {
                if (i !== targetIndex && MINISTERS[i].dept === MINISTERS[targetIndex].dept) {
                    var score = peerScores[i][targetIndex];
                    if (score !== null && score !== undefined) {
                        sum += score;
                        count++;
                    }
                }
            }
            if (count === 0) return 0; // 没有互评，返回 0
            return Math.round(sum / count);
        }

        // ==================== 认证 ====================
        function doAuth() {
            var input = document.getElementById('authInput');
            var name = input.value.trim();
            var errorEl = document.getElementById('authError');

            if (!name) {
                errorEl.textContent = '⚠️ 请输入姓名';
                return;
            }

            if (ALL_USERS.indexOf(name) === -1) {
                errorEl.textContent = '❌ 未找到 "' + name + '"';
                input.value = '';
                input.focus();
                return;
            }

            currentUser = name;
            isChair = (CHAIRS.indexOf(name) !== -1);

            currentUserIndex = -1;
            for (var i = 0; i < MINISTERS.length; i++) {
                if (MINISTERS[i].name === name) {
                    currentUserIndex = i;
                    break;
                }
            }

            document.getElementById('authModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            initApp();
        }

        // ==================== 主席评分 ====================
        function getAllScores() {
            var scores = [];
            for (var i = 0; i < MINISTERS.length; i++) {
                var el = document.getElementById('s' + i);
                var val = parseFloat(el.value);
                scores.push(isNaN(val) ? 0 : val);
            }
            return scores;
        }

        function calcStats(scores) {
            var n = scores.length;
            var sum = 0;
            for (var i = 0; i < n; i++) { sum += scores[i]; }
            var mean = sum / n;
            var sqSum = 0;
            for (var i = 0; i < n; i++) { sqSum += (scores[i] - mean) * (scores[i] - mean); }
            var std = Math.sqrt(sqSum / n);
            var maxVal = scores[0],
                minVal = scores[0];
            for (var i = 1; i < n; i++) {
                if (scores[i] > maxVal) maxVal = scores[i];
                if (scores[i] < minVal) minVal = scores[i];
            }
            var range = maxVal - minVal;
            var isPass = (std >= PASS_STD && range >= PASS_RANGE);
            return { mean: mean, std: std, range: range, isPass: isPass };
        }

        function buildTable() {
            var tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            for (var i = 0; i < MINISTERS.length; i++) {
                var m = MINISTERS[i];
                var tr = document.createElement('tr');
                tr.id = 'row' + i;
                tr.innerHTML = '<td><span class="dept-tag">' + m.dept + '</span></td>' +
                    '<td><strong>' + m.name + '</strong></td>' +
                    '<td><input type="number" id="s' + i + '" value="80" min="0" max="100" step="0.5" oninput="updateChairStats()"></td>' +
                    '<td id="grade' + i + '"><span class="grade-tag grade-good">良好</span></td>';
                tbody.appendChild(tr);
            }
        }

        function updateChairStats() {
            if (!isChair) return;
            var scores = getAllScores();
            var stats = calcStats(scores);
            document.getElementById('myAvg').textContent = stats.mean.toFixed(1);
            document.getElementById('myStd').textContent = stats.std.toFixed(2);
            document.getElementById('myRange').textContent = stats.range.toFixed(1);

            for (var i = 0; i < MINISTERS.length; i++) {
                var g = getGrade(scores[i]);
                document.getElementById('grade' + i).innerHTML = '<span class="grade-tag ' + g.cls + '">' + g.label +
                '</span>';
            }

            var statusEl = document.getElementById('myStatus');
            var exportBtn = document.getElementById('exportBtn');
            var legendEl = document.getElementById('gradeLegend');

            if (stats.isPass) {
                statusEl.innerHTML = '✅ 通过';
                statusEl.style.color = '#16a34a';
                exportBtn.disabled = false;
                exportBtn.textContent = '⬇ 导出';
                legendEl.className = 'grade-legend show';
            } else {
                var reasons = [];
                if (stats.std < PASS_STD) reasons.push('标准差 ' + stats.std.toFixed(2) + ' < ' + PASS_STD);
                if (stats.range < PASS_RANGE) reasons.push('极差 ' + stats.range.toFixed(1) + ' < ' + PASS_RANGE);
                statusEl.innerHTML = '🔴 ' + reasons.join('；');
                statusEl.style.color = '#dc2626';
                exportBtn.disabled = true;
                exportBtn.textContent = '🔒 未达标';
                legendEl.className = 'grade-legend';
            }
        }

        // ==================== 互评界面 ====================
        function renderPeerTab() {
            var container = document.getElementById('peerContent');
            container.innerHTML = '';

            if (currentUserIndex === -1) {
                container.innerHTML = '<div class="peer-status">⚠️ 无法识别您的身份</div>';
                return;
            }

            var currentDept = MINISTERS[currentUserIndex].dept;
            var peers = DEPT_GROUPS[currentDept] || [];
            var peerList = peers.filter(function(p) { return p.index !== currentUserIndex; });

            if (peerList.length === 0) {
                container.innerHTML = '<div class="peer-status">👤 您是部门唯一的负责人，无需互评</div>';
                return;
            }

            var html = '<div class="dept-title">📌 ' + currentDept + ' — 给同部门其他负责人打分</div>';
            html += '<div class="table-wrap"><table>';
            html += '<thead><tr><th style="min-width:80px;">被评人</th><th style="min-width:200px;">打分（40/60/80）</th><th style="min-width:60px;">当前</th></tr></thead><tbody>';

            for (var i = 0; i < peerList.length; i++) {
                var target = peerList[i];
                var targetName = MINISTERS[target.index].name;
                var currentScore = peerScores[currentUserIndex][target.index];
                var displayScore = (currentScore !== null && currentScore !== undefined) ? currentScore : '-';

                html += '<tr>';
                html += '<td><strong>' + targetName + '</strong></td>';
                html += '<td><div class="peer-btn-group">';
                var options = [40, 60, 80];
                for (var o = 0; o < options.length; o++) {
                    var val = options[o];
                    var selected = (currentScore === val) ? 'selected-' + val : '';
                    var label = val === 40 ? '不合格' : (val === 60 ? '合格' : '良好');
                    html += '<button class="peer-btn ' + selected + '" onclick="setPeerScore(' + currentUserIndex + ',' + target
                        .index + ',' + val + ')">' + val + '<br><small>' + label + '</small></button>';
                }
                html += '</div></td>';
                html += '<td><strong>' + displayScore + '</strong></td>';
                html += '</tr>';
            }

            html += '</tbody></table></div>';

            var ratedCount = 0;
            for (var j = 0; j < peerList.length; j++) {
                if (peerScores[currentUserIndex][peerList[j].index] !== null) ratedCount++;
            }
            html += '<div style="text-align:center;padding:10px;color:#888;font-size:13px;">已评 ' + ratedCount + '/' + peerList
                .length + ' 人</div>';

            container.innerHTML = html;
        }

        // ==================== 设置互评分数 ====================
        function setPeerScore(fromIdx, toIdx, score) {
            if (fromIdx !== currentUserIndex) {
                alert('您只能评价同部门的其他负责人');
                return;
            }
            if (fromIdx === toIdx) {
                alert('不能给自己打分');
                return;
            }
            if (MINISTERS[fromIdx].dept !== MINISTERS[toIdx].dept) {
                alert('只能评价同部门的负责人');
                return;
            }

            if (peerScores[fromIdx][toIdx] === score) {
                peerScores[fromIdx][toIdx] = null;
            } else {
                peerScores[fromIdx][toIdx] = score;
            }

            try {
                localStorage.setItem('peer_' + currentUser, JSON.stringify(peerScores[currentUserIndex]));
            } catch (e) {}

            renderPeerTab();
        }

        function loadPeerData() {
            try {
                var data = localStorage.getItem('peer_' + currentUser);
                if (data) {
                    var parsed = JSON.parse(data);
                    for (var key in parsed) {
                        if (parsed.hasOwnProperty(key)) {
                            peerScores[currentUserIndex][parseInt(key)] = parsed[key];
                        }
                    }
                }
            } catch (e) {}
        }

        // ==================== 导出 Excel（格式一致） ====================
        function exportExcel() {
            if (isChair) {
                // ===== 主席导出 =====
                var scores = getAllScores();
                var stats = calcStats(scores);
                if (stats.std < PASS_STD || stats.range < PASS_RANGE) {
                    alert('❌ 未达标：标准差需 ≥ ' + PASS_STD + '，极差需 ≥ ' + PASS_RANGE);
                    return;
                }
                var data = [
                    ['负责人姓名', '部门', '主席评分', '等级']
                ];
                for (var i = 0; i < MINISTERS.length; i++) {
                    var s = parseFloat(document.getElementById('s' + i).value) || 0;
                    var g = getGrade(s);
                    data.push([MINISTERS[i].name, MINISTERS[i].dept, s, g.label]);
                }
                data.push([]);
                data.push(['===== 统计 =====']);
                data.push(['平均分', stats.mean.toFixed(1)]);
                data.push(['标准差', stats.std.toFixed(2)]);
                data.push(['极差', stats.range.toFixed(1)]);
                data.push(['是否达标', stats.isPass ? '是' : '否']);

                var wb = XLSX.utils.book_new();
                var ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 12 }, { wch: 10 }];
                XLSX.utils.book_append_sheet(wb, ws, '主席评分');
                var fileName = currentUser + '_主席评分_' + new Date().toISOString().slice(0, 10) + '.xlsx';
                XLSX.writeFile(wb, fileName);
                alert('✅ 导出成功！');

            } else {
                // ===== 负责人导出：格式与主席一致 =====
                // 计算所有人的互评均分（同部门其他人给他打的平均分，没有则0）
                var peerAvgScores = [];
                for (var i = 0; i < MINISTERS.length; i++) {
                    peerAvgScores.push(getPeerAverage(i));
                }

                var data = [
                    ['负责人姓名', '部门', '互评得分']
                ];
                for (var i = 0; i < MINISTERS.length; i++) {
                    data.push([MINISTERS[i].name, MINISTERS[i].dept, peerAvgScores[i]]);
                }

                // 追加统计（格式与主席一致）
                var sum = 0;
                for (var i = 0; i < peerAvgScores.length; i++) { sum += peerAvgScores[i]; }
                var avg = sum / peerAvgScores.length;
                var sqSum = 0;
                for (var i = 0; i < peerAvgScores.length; i++) { sqSum += (peerAvgScores[i] - avg) * (peerAvgScores[i] -
                    avg); }
                var std = Math.sqrt(sqSum / peerAvgScores.length);
                var maxVal = Math.max.apply(null, peerAvgScores);
                var minVal = Math.min.apply(null, peerAvgScores);
                var range = maxVal - minVal;

                data.push([]);
                data.push(['===== 统计 =====']);
                data.push(['平均分', avg.toFixed(1)]);
                data.push(['标准差', std.toFixed(2)]);
                data.push(['极差', range.toFixed(1)]);
                data.push(['参与互评人数', MINISTERS.length]);

                var wb = XLSX.utils.book_new();
                var ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 12 }];
                XLSX.utils.book_append_sheet(wb, ws, '互评得分');
                var fileName = currentUser + '_互评汇总_' + new Date().toISOString().slice(0, 10) + '.xlsx';
                XLSX.writeFile(wb, fileName);
                alert('✅ 导出成功！');
            }
        }

        // ==================== 初始化 ====================
        function initApp() {
            document.getElementById('userBadge').textContent = '👤 ' + currentUser;

            if (isChair) {
                document.getElementById('pageTitle').textContent = '📋 主席评分';
                document.getElementById('chairSection').style.display = 'block';
                document.getElementById('peerSection').style.display = 'none';
                document.getElementById('footerTip').textContent = '💡 主席：输入分数 0-100 · 达标方可导出';
                document.getElementById('myLabel').textContent = '👤 ' + currentUser;
                buildTable();
                updateChairStats();
            } else {
                document.getElementById('pageTitle').textContent = '🤝 部门互评';
                document.getElementById('chairSection').style.display = 'none';
                document.getElementById('peerSection').style.display = 'block';
                document.getElementById('footerTip').textContent = '💡 负责人：给同部门其他负责人打分（40/60/80）';
                document.getElementById('exportBtn').disabled = false;
                document.getElementById('exportBtn').textContent = '⬇ 导出';
                loadPeerData();
                renderPeerTab();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.getElementById('authModal').style.display !== 'none') {
                doAuth();
            }
        });
    </script>
